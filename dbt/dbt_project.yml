name: "dataflowx"
version: "1.0.0"
config-version: 2

profile: "dataflowx"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  dataflowx:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: warehouse
