name: dbt

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - "db/init/**"
  pull_request:
    branches: [main]
    paths:
      - "dbt/**"
      - "db/init/**"

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataflowx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: dataflowx_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app + dbt
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install dbt-core==1.8.* dbt-postgres==1.8.*

      - name: Set up database schema
        run: python -m dataflowx.cli init-db

      - name: Generate sample data and ingest
        run: |
          python scripts/generate_data.py --scale sample
          python -m dataflowx.cli ingest

      - name: dbt deps + build
        working-directory: dbt
        run: |
          dbt debug
          dbt build
